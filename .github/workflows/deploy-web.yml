name: Publicar versão web

# A cada envio para as branches abaixo, exporta o jogo para navegador e publica no GitHub Pages.
on:
  push:
    branches: [ccr-62111919-vl22sn, main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Preparar modelos de exportação
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -r /root/.local/share/godot/export_templates/* "$HOME/.local/share/godot/export_templates/"

      - name: Exportar versão web
        working-directory: chavinhos-kart
        run: |
          mkdir -p build/web
          godot --headless --import || true
          godot --headless --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          ls -la build/web

      - name: Publicar na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: chavinhos-kart/build/web
          publish_branch: gh-pages
          force_orphan: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: chavinhos-kart/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
