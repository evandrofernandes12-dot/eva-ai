name: Publicar versão web

# A cada envio para as branches abaixo, exporta o jogo para navegador e publica no GitHub Pages.
on:
  push:
    branches: [ccr-62111919-vl22sn, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Exportar versão web
        working-directory: chavinhos-kart
        run: |
          mkdir -p build/web
          godot --headless --import || true
          godot --headless --export-release "Web" build/web/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: chavinhos-kart/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
